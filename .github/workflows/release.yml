name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Keyless cosign signing exchanges this for a short-lived certificate bound
  # to the workflow identity. Without it, the signs: block in .goreleaser.yml
  # cannot obtain one.
  id-token: write
  # Build provenance attestation.
  attestations: write

jobs:
  e2e:
    name: E2E (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - run: make e2e

  release:
    name: Release
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod

      # goreleaser's signs: and sboms: blocks shell out to these. Without
      # them installed the release fails at tag time, which is a worse
      # outcome than the unsigned artifacts they replace.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          version: "~> v2"
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  docker:
    name: Docker
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/eyelock/ynh:${{ steps.version.outputs.version }}-amd64
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Build and push arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/eyelock/ynh:${{ steps.version.outputs.version }}-arm64
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Create multi-arch manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          docker buildx imagetools create -t ghcr.io/eyelock/ynh:${VERSION} \
            ghcr.io/eyelock/ynh:${VERSION}-amd64 \
            ghcr.io/eyelock/ynh:${VERSION}-arm64
          docker buildx imagetools create -t ghcr.io/eyelock/ynh:latest \
            ghcr.io/eyelock/ynh:${VERSION}-amd64 \
            ghcr.io/eyelock/ynh:${VERSION}-arm64

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Keyless cosign signing exchanges this for a short-lived certificate bound
  # to the workflow identity. Without it, the signs: block in .goreleaser.yml
  # cannot obtain one.
  id-token: write
  # Build provenance attestation.
  attestations: write

jobs:
  e2e:
    name: E2E (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # The live smoke test installs from github.com/eyelock/assistants and
      # is skipped without this; a release should not ship if upstream
      # harnesses no longer install.
      - run: make e2e
        env:
          YNH_E2E_LIVE: "1"

  release:
    name: Release
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # goreleaser's signs: and sboms: blocks shell out to these. Without
      # them installed the release fails at tag time, which is a worse
      # outcome than the unsigned artifacts they replace.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          version: "~> v2"
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  docker:
    name: Docker
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/eyelock/ynh:${{ steps.version.outputs.version }}-amd64
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Build and push arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/eyelock/ynh:${{ steps.version.outputs.version }}-arm64
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: Create multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "ghcr.io/eyelock/ynh:${VERSION}" \
            "ghcr.io/eyelock/ynh:${VERSION}-amd64" \
            "ghcr.io/eyelock/ynh:${VERSION}-arm64"
          docker buildx imagetools create -t "ghcr.io/eyelock/ynh:latest" \
            "ghcr.io/eyelock/ynh:${VERSION}-amd64" \
            "ghcr.io/eyelock/ynh:${VERSION}-arm64"

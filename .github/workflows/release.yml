name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Keyless cosign signing exchanges this for a short-lived certificate bound
  # to the workflow identity. Without it, the signs: block in .goreleaser.yml
  # cannot obtain one.
  id-token: write
  # Build provenance attestation.
  attestations: write

# The spoolexporter module lives in the private eyelock/ynr repository:
# fetch it directly, not through the public proxy and checksum database.
env:
  GOPRIVATE: github.com/eyelock/ynr

jobs:
  e2e:
    name: E2E (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # Until eyelock/ynr is public, the spoolexporter module is private.
      # YNR_READ_REPO reads it; a pull request from a fork has no secrets
      # and cannot build.
      - name: Allow the private ynr module
        env:
          YNR_READ_REPO: ${{ secrets.YNR_READ_REPO }}
        run: git config --global url."https://x-access-token:${YNR_READ_REPO}@github.com/eyelock/ynr".insteadOf "https://github.com/eyelock/ynr"
      - run: make e2e

  release:
    name: Release
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # Until eyelock/ynr is public, the spoolexporter module is private.
      # YNR_READ_REPO reads it; a pull request from a fork has no secrets
      # and cannot build.
      - name: Allow the private ynr module
        env:
          YNR_READ_REPO: ${{ secrets.YNR_READ_REPO }}
        run: git config --global url."https://x-access-token:${YNR_READ_REPO}@github.com/eyelock/ynr".insteadOf "https://github.com/eyelock/ynr"

      # goreleaser's signs: and sboms: blocks shell out to these. Without
      # them installed the release fails at tag time, which is a worse
      # outcome than the unsigned artifacts they replace.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          version: "~> v2"
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  docker:
    name: Docker
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/eyelock/ynh:${{ steps.version.outputs.version }}-amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          # Mounted only for the module download; never in a layer.
          secrets: |
            ynr_token=${{ secrets.YNR_READ_REPO }}

      - name: Build and push arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/eyelock/ynh:${{ steps.version.outputs.version }}-arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          # Mounted only for the module download; never in a layer.
          secrets: |
            ynr_token=${{ secrets.YNR_READ_REPO }}

      - name: Create multi-arch manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          docker buildx imagetools create -t ghcr.io/eyelock/ynh:${VERSION} \
            ghcr.io/eyelock/ynh:${VERSION}-amd64 \
            ghcr.io/eyelock/ynh:${VERSION}-arm64
          docker buildx imagetools create -t ghcr.io/eyelock/ynh:latest \
            ghcr.io/eyelock/ynh:${VERSION}-amd64 \
            ghcr.io/eyelock/ynh:${VERSION}-arm64

name: CI

on:
  push:
    branches: [main, develop, 'hotfix/*']
  # No branch filter: CI must run on every pull request, including one whose
  # base is another feature branch. Stacked PRs are how a large change gets
  # reviewed in reviewable pieces, and a stacked PR that cannot run CI cannot
  # satisfy the pre-remote gates — so the work either goes ungated or gets
  # squashed into one unreviewable PR. Both are worse than running CI a few
  # extra times.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      artifacts: ${{ steps.filter.outputs.artifacts }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/**'
              # Inputs the Go tests read. Without these a PR that changes only
              # a fixture, a schema or a golden skips Build, Lint and Test, and
              # All Clear goes green having compiled nothing — the same failure
              # the artifacts filter below was added to fix, one directory over.
              #
              # testdata/  — four packages read testdata/export-harness alone.
              # test/      — e2e suites and the golden envelopes.
              # docs/schema/ — embedded into the binary by docs/schema/embed.go
              #              (//go:embed all:cli all:shared *.schema.json), and
              #              internal/clischema validates the goldens against it.
              - 'testdata/**'
              - 'test/**'
              - 'docs/schema/**'
            # The harness artifacts this repo ships and uses on itself. Before
            # this filter existed, a PR touching only skills/ or agents/ matched
            # no filter, skipped every job, and All Clear went green having run
            # nothing — a change to the product's own harness was ungated.
            # The release and packaging config. release.yml does not run on
            # pull requests and no job builds the image, so a broken
            # .goreleaser.yml or Dockerfile was discovered at tag time, on
            # the one run where failure is most expensive.
            packaging:
              - '.goreleaser.yml'
              - 'Dockerfile'
              - '.github/workflows/release.yml'
            artifacts:
              - 'skills/**'
              - 'agents/**'
              - 'rules/**'
              - '.claude/**'
              - '.ynh-plugin/**'
              - '**/plugin.json'
              - '**/marketplace.json'
              - 'AGENTS.md'
              - '.skillspector-baseline.yaml'
              - 'scripts/**'
              - 'Makefile'
              - '.github/workflows/**'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - run: make test

      # A direct import marked `// indirect` — the state this repo was in on
      # 2026-08-31 — is invisible to build, test and lint alike. This is the
      # only check that sees it.
      - name: go.mod is tidy
        run: go mod tidy -diff

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Check formatting
        run: |
          goimports -l . | tee /tmp/goimports.out
          gofmt -s -l . | tee -a /tmp/goimports.out
          if [ -s /tmp/goimports.out ]; then
            echo "Files need formatting:"
            cat /tmp/goimports.out
            exit 1
          fi

  artifacts:
    name: Harness Artifacts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.artifacts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - name: Validate and lint harness artifacts
        run: make check-artifacts
      # Asserts every vendor ynh reports is documented AND assembles the same
      # artifact set. jq is preinstalled on ubuntu-latest runners.
      - name: Check vendor parity
        run: make check-vendor-parity
      # The marketplace is how someone installs these skills without ynh. If it
      # stops building, that path breaks silently — nothing else exercises it.
      - name: Check native marketplace builds
        run: make check-marketplace

  skill-security:
    name: Skill Security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.artifacts == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      # Pinned to a tag on purpose. SkillSpector is not on PyPI, so this is a
      # git install; unpinned, an upstream push would silently change what
      # gates our merges — the supply-chain risk the scanner exists to catch.
      - name: Install SkillSpector
        run: pip install "git+https://github.com/NVIDIA/SkillSpector.git@v2.11.0"
      - name: Scan harness artifacts
        run: make scan-artifacts
      # Advisory upload: the gate is the scan's exit code above. A code
      # scanning misconfiguration must not mask a real finding, nor block a
      # merge on its own.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          sarif_file: .skillspector-sarif
          category: skillspector

  packaging:
    name: Packaging Config
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # `goreleaser check` validates the config without releasing anything,
      # including the signs: and sboms: blocks. Without this a typo there
      # surfaces only when a tag is pushed.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          version: "~> v2"
          args: check

      # The image is built nowhere else, so the base-image digest and the
      # installer checksum were unverified until somebody built it by hand.
      - name: Build the container image
        run: docker build --tag ynh:ci-check .

  all-clear:
    name: All Clear
    runs-on: ubuntu-latest
    needs: [changes, build, test, lint, format, artifacts, skill-security, packaging]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  format: ${{ needs.format.result }}"
          echo "  artifacts: ${{ needs.artifacts.result }}"
          echo "  skill-security: ${{ needs['skill-security'].result }}"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required checks failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks were cancelled"
            exit 1
          else
            echo "All checks passed or skipped appropriately"
            exit 0
          fi

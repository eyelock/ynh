name: CI

on:
  push:
    branches: [main, develop, 'hotfix/*']
  # No branch filter: CI must run on every pull request, including one whose
  # base is another feature branch. Stacked PRs are how a large change gets
  # reviewed in reviewable pieces, and a stacked PR that cannot run CI cannot
  # satisfy the pre-remote gates — so the work either goes ungated or gets
  # squashed into one unreviewable PR. Both are worse than running CI a few
  # extra times.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      artifacts: ${{ steps.filter.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/**'
            # The harness artifacts this repo ships and uses on itself. Before
            # this filter existed, a PR touching only skills/ or agents/ matched
            # no filter, skipped every job, and All Clear went green having run
            # nothing — a change to the product's own harness was ungated.
            artifacts:
              - 'skills/**'
              - 'agents/**'
              - 'rules/**'
              - '.claude/**'
              - '.ynh-plugin/**'
              - '**/plugin.json'
              - 'AGENTS.md'
              - '.skillspector-baseline.yaml'
              - 'Makefile'
              - '.github/workflows/**'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Check formatting
        run: |
          goimports -l . | tee /tmp/goimports.out
          gofmt -s -l . | tee -a /tmp/goimports.out
          if [ -s /tmp/goimports.out ]; then
            echo "Files need formatting:"
            cat /tmp/goimports.out
            exit 1
          fi

  artifacts:
    name: Harness Artifacts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.artifacts == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate and lint harness artifacts
        run: make check-artifacts

  skill-security:
    name: Skill Security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.artifacts == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Pinned to a tag on purpose. SkillSpector is not on PyPI, so this is a
      # git install; unpinned, an upstream push would silently change what
      # gates our merges — the supply-chain risk the scanner exists to catch.
      - name: Install SkillSpector
        run: pip install "git+https://github.com/NVIDIA/SkillSpector.git@v2.11.0"
      - name: Scan harness artifacts
        run: make scan-artifacts
      # Advisory upload: the gate is the scan's exit code above. A code
      # scanning misconfiguration must not mask a real finding, nor block a
      # merge on its own.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .skillspector-sarif
          category: skillspector

  all-clear:
    name: All Clear
    runs-on: ubuntu-latest
    needs: [changes, build, test, lint, format, artifacts, skill-security]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  format: ${{ needs.format.result }}"
          echo "  artifacts: ${{ needs.artifacts.result }}"
          echo "  skill-security: ${{ needs['skill-security'].result }}"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required checks failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks were cancelled"
            exit 1
          else
            echo "All checks passed or skipped appropriately"
            exit 0
          fi

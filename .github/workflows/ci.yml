name: CI

on:
  push:
    branches: [main, develop, 'hotfix/*']
  # No branch filter: CI must run on every pull request, including one whose
  # base is another feature branch. Stacked PRs are how a large change gets
  # reviewed in reviewable pieces, and a stacked PR that cannot run CI cannot
  # satisfy the pre-remote gates — so the work either goes ungated or gets
  # squashed into one unreviewable PR. Both are worse than running CI a few
  # extra times.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      artifacts: ${{ steps.filter.outputs.artifacts }}
      packaging: ${{ steps.filter.outputs.packaging }}
      registry: ${{ steps.filter.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/**'
              # Inputs the Go tests read. Without these a PR that changes only
              # a fixture, a schema or a golden skips Build, Lint and Test, and
              # All Clear goes green having compiled nothing — the same failure
              # the artifacts filter below was added to fix, one directory over.
              #
              # testdata/  — four packages read testdata/export-harness alone.
              # test/      — e2e suites and the golden envelopes.
              # docs/schema/ — embedded into the binary by docs/schema/embed.go
              #              (//go:embed all:cli all:shared *.schema.json), and
              #              internal/clischema validates the goldens against it.
              # docs/:     internal/docs checks every link, anchor, sidebar
              #              entry and tutorial Next link, and cmd/ynd reads
              #              the tutorials; a docs-only PR must run them.
              - 'testdata/**'
              - 'test/**'
              - 'docs/**'
              # telemetry/registry/ — embedded into the binary, and
              #              internal/telemetry checks names_gen.go against it.
              - 'telemetry/**'
              # .ynr/ — the ynr conformance scenarios the Conformance job runs.
              - '.ynr/**'
              # scripts/ — Go tests run scripts from it (internal/vendor's
              #              TestHookEventParityScript runs hook-event-parity.sh),
              #              so a scripts-only PR must run Test.
              - 'scripts/**'
              # .golangci.yml — the Lint job's config; a change to it alters
              #              what Lint accepts.
              - '.golangci.yml'
              # **/*.md — internal/docs TestRepoMarkdownLinksResolve checks every
              #              relative link and anchor in markdown outside docs/
              #              (README.md, AGENTS.md, .github/, skills/, .claude/).
              - '**/*.md'
              # skills/ — cmd/ynd and internal/plugin starter_sets_test read
              #              skills/ynh-sensors/references/starter-sets.md.
              - 'skills/**'
              # **/*.schema.json — internal/clischema TestSingleSchemaTree walks the
              #              whole repo for a schema outside docs/schema.
              - '**/*.schema.json'
            # ynh's telemetry registry, an OpenTelemetry Weaver registry
            # (ynr ADR-007), which Weaver itself checks.
            registry:
              - 'telemetry/registry/**'
              - '.github/workflows/ci.yml'
            # The harness artifacts this repo ships and uses on itself. Before
            # this filter existed, a PR touching only skills/ or agents/ matched
            # no filter, skipped every job, and All Clear went green having run
            # nothing — a change to the product's own harness was ungated.
            # The release and packaging config. release.yml does not run on
            # pull requests and no job builds the image, so a broken
            # .goreleaser.yml or Dockerfile was discovered at tag time, on
            # the one run where failure is most expensive.
            packaging:
              - '.goreleaser.yml'
              - 'Dockerfile'
              - '.github/workflows/release.yml'
            artifacts:
              - 'skills/**'
              - 'agents/**'
              - 'rules/**'
              - '.claude/**'
              - '.agents/harness/**'
              - '**/plugin.json'
              - '**/marketplace.json'
              - 'AGENTS.md'
              - '.skillspector-baseline.yaml'
              - 'scripts/**'
              - 'Makefile'
              - '.github/workflows/**'
              # check-vendor-parity checks this page (assertion H, #718), so
              # a PR that edits only the page must still run it.
              - 'docs/vendor-parity.md'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod
      - run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod
      # The telemetry relay test against the real ynr (TestAgentRun_RealRelayJoinsRunTrace)
      # skips without ynr on PATH. Install the released binary users get, checked
      # against the release's checksums, which are first verified against their
      # sigstore bundle; move YNR_VERSION in the Dockerfile when the relay's
      # contract changes.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - name: Install ynr for the relay test
        run: |
          # The Dockerfile is the one place the version is pinned.
          YNR_VERSION="$(sed -n 's/^ARG YNR_VERSION=//p' Dockerfile)"
          [ -n "$YNR_VERSION" ]
          dir="$RUNNER_TEMP/ynr"
          mkdir -p "$dir"
          asset="ynr_${YNR_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/eyelock/ynr/releases/download/v${YNR_VERSION}"
          curl -fsSL --output-dir "$dir" -O "$base/$asset" -O "$base/checksums.txt" -O "$base/checksums.txt.sigstore.json"
          # checksums.txt must be the one ynr's release workflow signed at this tag.
          cosign verify-blob \
            --bundle "$dir/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/eyelock/ynr/.github/workflows/release.yml@refs/tags/v${YNR_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$dir/checksums.txt"
          (cd "$dir" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$asset" -C "$dir" ynr
          "$dir/ynr" --version
          echo "$dir" >> "$GITHUB_PATH"
      - run: make test

      # A direct import marked `// indirect` — the state this repo was in on
      # 2026-08-31 — is invisible to build, test and lint alike. This is the
      # only check that sees it.
      - name: go.mod is tidy
        run: go mod tidy -diff

      # The spoolexporter library writes the spool the relay scrubs; one newer
      # than the pinned ynr binary would write what that binary cannot read.
      - name: spoolexporter is no newer than the ynr pin
        run: |
          pin="$(sed -n 's/^ARG YNR_VERSION=//p' Dockerfile)"
          lib="$(go list -m -f '{{.Version}}' github.com/eyelock/ynr/spoolexporter)"
          bash scripts/spoolexporter-pin.sh "$pin" "$lib"
      # The Docker image builds with the Dockerfile's GO_VERSION, not go.mod's
      # toolchain (the golang images set GOTOOLCHAIN=local); this keeps the two
      # equal so govulncheck scans the Go the image ships.
      - name: Dockerfile Go matches go.mod toolchain
        run: make check-go-pin

  srt:
    name: Test (real srt, Linux)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # srt on Linux needs bubblewrap, socat and ripgrep, and bubblewrap needs
      # unprivileged user namespaces, which Ubuntu 24.04 restricts by default.
      - name: Install srt
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo npm install -g @anthropic-ai/sandbox-runtime@0.0.83
          srt --version
          lsb_release -d; uname -r; bwrap --version
          sysctl -a 2>/dev/null | grep -E 'userns|unprivileged' || true
      # Runs the tests that skip without srt, so ynh #920's Done-when (a
      # credential read is refused, the worktree still readable) is shown on
      # Linux on every change. They must run, not skip: -v output is checked.
      - name: Test against real srt
        env:
          YNH_SRT_TEST_NO_SECCOMP: '1'
        run: |
          go test -v -run 'TestSrt_' ./internal/agent/ | tee srt-test.log
          grep -q -- '--- PASS: TestSrt_DeniesCredentialRead' srt-test.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Check formatting
        run: |
          goimports -l . | tee /tmp/goimports.out
          gofmt -s -l . | tee -a /tmp/goimports.out
          if [ -s /tmp/goimports.out ]; then
            echo "Files need formatting:"
            cat /tmp/goimports.out
            exit 1
          fi

  artifacts:
    name: Harness Artifacts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.artifacts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod
      - name: Validate and lint harness artifacts
        run: make check-artifacts
      # Asserts every vendor ynh reports is documented AND assembles the same
      # artifact set. jq is preinstalled on ubuntu-latest runners.
      - name: Check vendor parity
        run: make check-vendor-parity
      # The marketplace is how someone installs these skills without ynh. If it
      # stops building, that path breaks silently — nothing else exercises it.
      - name: Check native marketplace builds
        run: make check-marketplace

  skill-security:
    name: Skill Security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.artifacts == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The same gate `make scan-artifacts` runs. Pinned by commit, so the
      # action builds its scanner image from that commit's Dockerfile, which
      # pins SkillSpector itself by commit: an upstream push cannot change
      # what gates our merges, the supply-chain risk the scanner exists to
      # catch. On a pull request only the changed skills and included
      # directories are scanned; a baseline change scans everything.
      # Keep include/exclude in step with SKILLSPECTOR_ARGS in the Makefile.
      - name: Scan harness artifacts
        id: scan
        uses: eyelock/actions/skillspector@2b4b0eafc45da186506a6fd72774482b636d55aa  # skillspector-v1.1.0
        with:
          include: |
            agents
            rules
            .claude
          exclude: |
            testdata/*
      # Advisory upload: the gate is the scan step above. A code scanning
      # misconfiguration must not mask a real finding, nor block a merge on
      # its own.
      - name: Upload SARIF to code scanning
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: skillspector

  packaging:
    name: Packaging Config
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # A `goreleaser check` step belongs here and is deliberately absent.
      # The config carries deprecations (`brews`, `dockers`) that cannot be
      # cleared without changing what a release publishes, and `check` exits
      # non-zero for a deprecation exactly as it does for an invalid config.
      # Every way of distinguishing the two here was worse than leaving it
      # out: failing on deprecations makes the job permanently red and
      # therefore ignored, and a check that cannot fail observes nothing.
      #
      # Tracked as its own change, where the deprecations get migrated and the
      # check can then be strict and meaningful.

      # The image is built nowhere else, so the base-image digest and the
      # installer checksum were unverified until somebody built it by hand.
      - name: Build the container image
        run: docker buildx build --load --tag ynh:ci-check .

  registry:
    # ynh's telemetry registry is an OpenTelemetry Weaver registry (ynr
    # ADR-007): Weaver checks it, against the semantic conventions it pins.
    # The build reads only the subset it uses (internal/telemetry/weaver),
    # so this is the one check that the registry is valid Weaver.
    name: Telemetry Registry
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    env:
      WEAVER_VERSION: v0.27.0
      # The tarball's SHA-256, pinned beside the version: the release's own
      # .sha256 must agree with it, and the download must match it, before
      # anything is extracted or run. Move both together.
      WEAVER_SHA256: 7e497eb48215a5240a0bf77747cf431596c468f1039d481807b1f1e096cb5ac2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Weaver, checked against its pinned checksum
        run: |
          set -eu
          dir="$RUNNER_TEMP/weaver"
          mkdir -p "$dir"
          asset="weaver-x86_64-unknown-linux-gnu.tar.xz"
          base="https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}"
          curl -fsSL --output-dir "$dir" -O "$base/$asset" -O "$base/$asset.sha256"
          # The release's published checksum names the same digest as the pin.
          grep -q "^${WEAVER_SHA256} " "$dir/$asset.sha256"
          (cd "$dir" && echo "${WEAVER_SHA256}  ${asset}" | sha256sum -c -)
          tar -xJf "$dir/$asset" -C "$dir"
          "$dir/weaver-x86_64-unknown-linux-gnu/weaver" --version
          echo "$dir/weaver-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: weaver registry check
        run: weaver registry check -r telemetry/registry

  conformance:
    # ynr conformance (ynr ADR-008): ynh's own scenarios in .ynr/conformance.yaml
    # run `ynh agent run` against ynr's stub vendor, offline, with no model and
    # no secret, against the ynr release the Dockerfile pins. Among All Clear's needs, so a red
    # run turns All Clear red.
    name: Conformance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - name: Install ynr and its stub vendor, checked against the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The one pin: the Dockerfile's ARG, as the Test job reads it.
          YNR_VERSION="$(sed -n 's/^ARG YNR_VERSION=//p' Dockerfile)"
          [ -n "$YNR_VERSION" ]
          dl="$RUNNER_TEMP/ynr-download"
          bin="$RUNNER_TEMP/ynr-bin"
          mkdir -p "$dl" "$bin"
          ynr="ynr_${YNR_VERSION}_linux_amd64.tar.gz"
          stub="ynr-stub-vendor_${YNR_VERSION}_linux_amd64.tar.gz"
          gh release download "v${YNR_VERSION}" -R eyelock/ynr -D "$dl" -p "$ynr" -p "$stub" -p checksums.txt -p checksums.txt.sigstore.json
          cd "$dl"
          # checksums.txt must be the one ynr's release workflow signed at this tag.
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/eyelock/ynr/.github/workflows/release.yml@refs/tags/v${YNR_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          grep -e " ${ynr}\$" -e " ${stub}\$" checksums.txt > wanted.txt
          [ "$(wc -l < wanted.txt)" -eq 2 ]
          sha256sum --check --strict wanted.txt
          tar -xzf "$ynr" -C "$bin" ynr
          tar -xzf "$stub" -C "$bin" ynr-stub-vendor
          "$bin/ynr" version
          echo "$bin" >> "$GITHUB_PATH"
      - name: ynr conformance
        run: make conformance CONFORMANCE_FORMAT=text

  e2e:
    # The full E2E suite (make e2e) on every pull request, among All Clear's needs so a PR that
    # breaks it is red before merge. It runs in about 40 seconds, so no subset is needed. It
    # was a post-merge-only check until ynh #1018 passed review and broke develop's E2E on merge
    # (ynh #1069). e2e.yml still reports on develop pushes and gates releases.
    name: E2E Suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7
        with:
          go-version-file: go.mod
      - run: make e2e

  all-clear:
    name: All Clear
    runs-on: ubuntu-latest
    needs: [changes, build, test, srt, lint, format, artifacts, skill-security, packaging, registry, conformance, e2e]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Job results:"
          echo "  changes: ${{ needs.changes.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  srt: ${{ needs.srt.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  format: ${{ needs.format.result }}"
          echo "  artifacts: ${{ needs.artifacts.result }}"
          echo "  skill-security: ${{ needs['skill-security'].result }}"
          echo "  packaging: ${{ needs.packaging.result }}"
          echo "  registry: ${{ needs.registry.result }}"
          echo "  conformance: ${{ needs.conformance.result }}"
          echo "  e2e: ${{ needs.e2e.result }}"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required checks failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks were cancelled"
            exit 1
          else
            echo "All checks passed or skipped appropriately"
            exit 0
          fi

name: E2E

# E2E gates release promotion, and reports on every merge to `develop`.
#
# Feature work targeting `develop` still stays fast: this does not run on
# pull requests, so no PR waits on a 15-minute suite. See
# .claude/plans/e2e-test-suite.md for the full trigger model.
#
# The post-merge trigger closes a real gap. Running only at release
# boundaries meant the suite could go weeks without executing — on
# 2026-08-30 nine PRs merged to `develop`, including one that changed what
# `ynh check` treats as a failure, and e2e ran on none of them. A regression
# was then found at release time against a batch of changes rather than
# against the commit that caused it. Running post-merge keeps PRs fast and
# restores attribution to a single merge.
#
# Tag-push (v*) triggers go through release.yml's `e2e` job, which
# blocks `goreleaser`. This workflow handles push-to-develop, PR-to-main and
# ad-hoc runs.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The spoolexporter module lives in the private eyelock/ynr repository:
# fetch it directly, not through the public proxy and checksum database.
env:
  GOPRIVATE: github.com/eyelock/ynr

jobs:
  e2e:
    name: E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # Until eyelock/ynr is public, the spoolexporter module is private.
      # YNR_READ_REPO reads it; a pull request from a fork has no secrets
      # and cannot build.
      - name: Allow the private ynr module
        env:
          YNR_READ_REPO: ${{ secrets.YNR_READ_REPO }}
        run: git config --global url."https://x-access-token:${YNR_READ_REPO}@github.com/eyelock/ynr".insteadOf "https://github.com/eyelock/ynr"
      - run: make e2e

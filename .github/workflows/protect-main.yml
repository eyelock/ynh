name: Protect Main

on:
  pull_request:
    branches: [main]
  # Required on main, so it must report in the merge queue too. The queue holds
  # only a PR that already passed this check, and a merge group has no head_ref,
  # so there the job passes without re-checking.
  merge_group:

jobs:
  check-source-branch:
    name: Verify PR source branch
    runs-on: ubuntu-latest
    steps:
      - name: Check that PR targets main only from develop, hotfix/*, or release/*
        # The branch name is attacker-controlled: it reaches the script as an
        # environment variable, never interpolated into the shell source.
        env:
          SOURCE: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "merge_group" ]]; then
            echo "Merge queue: the source branch was verified when the PR entered the queue"
            exit 0
          fi

          echo "PR source branch: $SOURCE"

          if [[ "$SOURCE" == "develop" ]] || [[ "$SOURCE" == hotfix/* ]] || [[ "$SOURCE" == release/* ]]; then
            echo "✅ Source branch '$SOURCE' is allowed to target main"
          else
            echo "❌ PRs to main must come from 'develop', 'hotfix/*', or 'release/*'"
            echo "   Source branch '$SOURCE' is not allowed."
            echo "   Open your PR against 'develop' instead."
            exit 1
          fi

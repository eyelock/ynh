version: 2

# Until eyelock/ynr is public, the spoolexporter module is a private git
# repository; Dependabot reads it with the Dependabot secret YNR_READ_REPO.
registries:
  ynr:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.YNR_READ_REPO}}

updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Keep Go module dependencies up to date
  - package-ecosystem: "gomod"
    directory: "/"
    registries:
      - ynr
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Keep the base images in the Dockerfile up to date
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Keep the image in docker-compose.yml up to date
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Keep Terraform providers up to date
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/*"
      - "/infra/github"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

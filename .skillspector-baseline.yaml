# SkillSpector suppression baseline
#
# Every entry below is a false positive with the same root cause: ynh is a
# harness manager, so its skills and references are *about* agent tooling —
# config directories, skill layouts, install commands, hook events. A scanner
# looking for agents that manipulate agent tooling lights up on the subject
# matter itself.
#
# Deliberately `rules` (glob) rather than `fingerprints` (exact hash).
# Fingerprints bind to the scanner version and the complete source text, so
# they fail closed on every SkillSpector upgrade and every reword — CI would
# break on unrelated edits. Rules survive drift and carry a reviewable reason.
#
# Every rule is scoped with `path:`. A bare `id:` would suppress its rule
# family repo-wide, including findings we would want to see. If you add a
# rule here, scope it and say why in `reason:`.
#
# Regenerate nothing automatically. Triage each new finding by hand.

version: 2

rules:
  # --- AS3 · Agent Snooping / Skill Enumeration ---------------------------
  # Fires on instructions to read or list other skills' files. That is what a
  # harness manager does: ynd compress rewrites skill files, ynh-create-harness
  # scaffolds them, add-vendor-adapter walks them to build an adapter. Scoped
  # per file so a skill that starts reading skills for no reason still fires.

  - id: "AS3"
    path: "*ynd-compress/SKILL.md"
    reason: "ynd compress operates ON skill and prompt files by design — reading them is the feature, not reconnaissance."

  - id: "AS3"
    path: "*ynh-create-harness/SKILL.md"
    reason: "Scaffolds skills/ and agents/ for a new harness; must enumerate the layout it is creating."

  - id: "AS3"
    path: "*add-vendor-adapter/SKILL.md"
    reason: "Walks existing adapters and their skill layouts as the reference for a new vendor adapter."

  - id: "AS3"
    path: "*ynh-dev/references/skill-authoring.md"
    reason: "Authoring guide: documents the SKILL.md layout so contributors write valid artifacts."

  # --- AS1 · Agent Snooping / Agent Config Directory Access ---------------
  - id: "AS1"
    path: "*vendor-adapters/references/codex.md"
    reason: "Vendor reference documenting where Codex stores its own config (~/.codex/config.toml). An adapter author cannot target a vendor without knowing its config path; this is documentation, not access."

  # --- SC2 · Supply Chain / External Script Fetching ----------------------
  - id: "SC2"
    path: "*vendor-adapters/references/cursor.md"
    reason: "Quotes Cursor's official documented installer (curl https://cursor.com/install | bash) as a reference fact about the vendor. The skill neither runs it nor tells anyone to."

  # --- AR2 · Anti-Refusal Statement ---------------------------------------
  - id: "AR2"
    path: "*vendor-adapters/SKILL.md"
    reason: "Matches the word CRITICAL used as emphasis in hand-tested research notes ('CRITICAL, hand-tested finding: hooks silently no-op'). Emphasis in findings, not an instruction to override refusals."

  # --- EA2 · Excessive Agency / Autonomous Decision Making ----------------
  - id: "EA2"
    path: "*vendor-adapters/SKILL.md"
    reason: "Matches adapter design rules stated imperatively ('never shell out to copilot init', 'write .mcp.json directly'). These constrain what ynh's Go code does; they grant no agent autonomy."

  # --- RA2 · Rogue Agent / Session Persistence ----------------------------
  - id: "RA2"
    path: "*vendor-adapters/SKILL.md"
    reason: "Documents vendor session and MCP config behaviour (copilot mcp add writes user-level config) so the adapter can avoid depending on it."

  - id: "RA2"
    path: "*agents/evals.md"
    reason: "Matches the per-tutorial sandbox setup (SANDBOX=/tmp/ynh-eval-T<N>). The sandbox exists to CONTAIN the eval run, not to persist across sessions."

  # --- TM1 · Tool Misuse / Tool Parameter Abuse ---------------------------
  # Scoped to two files on purpose. `rm -rf` in an agent instruction is a real
  # risk class and this repo has the scar to prove it — see
  # .claude/rules/destructive-operations.md. These two occurrences are bounded
  # to a /tmp sandbox path the agent itself created. An unscoped rm -rf in any
  # other file must still fail the scan.

  - id: "TM1"
    path: "*agents/evals.md"
    reason: "rm -rf is bounded to /tmp/ynh-eval-T<N>, a sandbox the eval agent creates and tears down. Scoped to this file only — see .claude/rules/destructive-operations.md for why a blanket rm -rf suppression is not acceptable here."

  - id: "TM1"
    path: "*rules/branching.md"
    reason: "Matches `git push` in the documented Gitflow workflow. Branching instructions for contributors, not tool parameter manipulation."

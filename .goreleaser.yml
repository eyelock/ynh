version: 2

project_name: ynh

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ynh
    main: ./cmd/ynh
    binary: ynh
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/eyelock/ynh/internal/config.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: ynd
    main: ./cmd/ynd
    binary: ynd
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/eyelock/ynh/internal/config.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Checksums protect against corruption in transit. They do not protect against
# a compromised pipeline, which produces perfectly valid checksums for tampered
# binaries. Signing the checksum file makes the pipeline itself attestable.
#
# Keyless: the signature is bound to the workflow identity via OIDC and logged
# in Rekor, so there is no private key to store or rotate. Requires
# id-token: write on the releasing job.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# An SBOM per archive, so a consumer can answer "does this release contain X"
# without unpacking and guessing.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

dockers:
  - image_templates:
      - "ghcr.io/eyelock/ynh:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    extra_files:
      - go.mod
      - go.sum
      - cmd/
      - internal/
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
    goos: linux
    goarch: amd64
  - image_templates:
      - "ghcr.io/eyelock/ynh:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile
    extra_files:
      - go.mod
      - go.sum
      - cmd/
      - internal/
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
    goos: linux
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/eyelock/ynh:{{ .Version }}"
    image_templates:
      - "ghcr.io/eyelock/ynh:{{ .Version }}-amd64"
      - "ghcr.io/eyelock/ynh:{{ .Version }}-arm64"
  - name_template: "ghcr.io/eyelock/ynh:latest"
    image_templates:
      - "ghcr.io/eyelock/ynh:{{ .Version }}-amd64"
      - "ghcr.io/eyelock/ynh:{{ .Version }}-arm64"

brews:
  - repository:
      owner: eyelock
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/eyelock/ynh"
    description: "Harness template manager for AI coding assistants"
    license: "MIT"
    test: |
      system "#{bin}/ynh", "version"
      system "#{bin}/ynd", "version"
    install: |
      bin.install "ynh"
      bin.install "ynd"
